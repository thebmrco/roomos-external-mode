<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>External Mode</title>
<style>
  /* Styled to blend in with the RoomOS 11 Navigator UI:
     near-black background, dark rounded cards, pill buttons, CiscoSans. */
  :root {
    --bg: #000000;
    --card: rgba(255, 255, 255, 0.07);
    --card-border: rgba(255, 255, 255, 0.06);
    --fg: #ffffff;
    --muted: rgba(255, 255, 255, 0.55);
    --faint: rgba(255, 255, 255, 0.35);
    --blue: #1170cf;
    --green: #24ab31;
    --bg-image: none;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    /* wallpaper (config.json "background"), tinted so the white UI stays readable */
    background:
      linear-gradient(180deg, rgba(5, 14, 32, 0.55) 0%, rgba(3, 8, 20, 0.72) 62%, rgba(1, 4, 12, 0.88) 100%),
      var(--bg-image) center 65% / cover no-repeat,
      var(--bg);
    color: var(--fg);
    font-family: "CiscoSansTT", "CiscoSans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3.4vh 5vw 5vh;
    gap: 2.2vh;
  }
  body.loading > * { visibility: hidden; }

  /* Top bar — mirrors the Navigator home screen (room name left, clock right) */
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2.6vh 3.4vw;
    font-size: 2.5vh;
    color: var(--muted);
    font-weight: 400;
  }
  /* keep clear of the webview close (X) button in the top-right corner */
  #clock { font-variant-numeric: tabular-nums; margin-right: 9vw; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 1.1vw;
    background: rgba(17, 112, 207, 0.18);
    color: #6db1f0;
    border-radius: 999px;
    padding: 1.2vh 2.6vw;
    font-size: 2.2vh;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .badge .dot {
    width: 1.3vh; height: 1.3vh; border-radius: 50%;
    background: #6db1f0;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .usb-icon { width: 9vh; height: 9vh; color: var(--fg); opacity: 0.9; }

  h1 { font-size: 5.2vh; font-weight: 400; line-height: 1.2; letter-spacing: -0.01em; }
  p.sub { font-size: 2.8vh; color: var(--muted); max-width: 58ch; line-height: 1.55; font-weight: 300; }
  p.sub strong { color: var(--fg); font-weight: 400; }

  /* Bottom row: service tiles on the left, the feedback QR card on the right */
  #bottomrow {
    margin-top: 1vh;
    display: flex;
    gap: 1.8vw;
    align-items: stretch;
    justify-content: center;
  }

  /* Service request card — rounded dark tile like the Navigator call controls */
  #services {
    background: rgba(10, 16, 28, 0.55);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 3vh;
    padding: 2.4vh 2.4vw;
    display: flex;
    gap: 1.8vw;
    align-items: stretch;
    justify-content: center;
  }
  #services:empty { display: none; }

  button.svc {
    font: inherit;
    font-size: 2.2vh;
    font-weight: 400;
    color: var(--fg);
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 2.2vh;
    /* square tiles; they stretch to match the feedback card's height */
    width: 19vh;
    min-height: 19vh;
    padding: 1.6vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2vh;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.06s ease;
  }
  button.svc:active { transform: scale(0.96); background: rgba(255,255,255,0.2); }
  button.svc:disabled { opacity: 0.55; }
  button.svc svg { width: 4.6vh; height: 4.6vh; }
  button.svc .state { font-size: 1.9vh; color: var(--muted); min-height: 2.2vh; }
  button.svc.done { background: rgba(36, 171, 49, 0.25); }
  button.svc.done .state { color: var(--green); }

  /* Feedback card — QR code shown directly on the screen, tap opens the form here */
  #feedback {
    font: inherit;
    color: var(--fg);
    background: rgba(10, 16, 28, 0.55);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 3vh;
    padding: 2.4vh 1.8vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.4vh;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.06s ease;
  }
  #feedback[hidden] { display: none; }
  #feedback:active { transform: scale(0.98); background: rgba(255,255,255,0.16); }
  #feedback .title { font-size: 2.2vh; font-weight: 400; }
  #feedback .cap { font-size: 1.9vh; color: var(--muted); line-height: 1.35; }

  /* QR codes are rendered client-side from config.json */
  .qr {
    background: #ffffff;
    border-radius: 1.6vh;
    padding: 1.2vh;
    line-height: 0;
  }
  .qr svg { width: 19vh; height: 19vh; display: block; }

  /* Fullscreen overlays: Wi-Fi QR, request dialogs, feedback form */
  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.75);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    z-index: 10;
  }
  .overlay.open { display: flex; }

  #wifiOverlay { flex-direction: column; gap: 2vh; }
  #wifiOverlay .qr { border-radius: 2vh; padding: 2.4vh; }
  #wifiOverlay .qr svg { width: 34vh; height: 34vh; }
  #wifiOverlay .ssid { font-size: 3vh; font-weight: 400; }
  #wifiOverlay .hint { font-size: 2.2vh; color: var(--muted); }

  /* Request dialog (services with options and/or name) */
  .dsheet {
    background: rgba(20, 28, 44, 0.95);
    border: 1px solid var(--card-border);
    border-radius: 2.6vh;
    padding: 3.4vh 3vw;
    display: flex;
    flex-direction: column;
    gap: 2vh;
    min-width: 46vw;
    max-width: 70vw;
  }
  .dsheet h2 { font-size: 3.4vh; font-weight: 400; }
  .dsheet p { font-size: 2.4vh; color: var(--muted); }
  .dsheet p:empty { display: none; }
  .opts { display: flex; flex-wrap: wrap; gap: 1.2vh; }
  .opts:empty { display: none; }
  .opts button {
    font: inherit;
    font-size: 2.4vh;
    color: var(--fg);
    background: rgba(255,255,255,0.1);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 1.8vh 2.4vw;
    cursor: pointer;
  }
  .opts button.sel { background: var(--blue); border-color: rgba(255,255,255,0.4); }
  .dsheet input {
    font: inherit;
    font-size: 2.4vh;
    color: var(--fg);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 1.6vh;
    padding: 1.8vh 1.6vw;
    outline: none;
  }
  .dsheet input[hidden] { display: none; }
  .dsheet input::placeholder { color: var(--faint); }
  .actions { display: flex; justify-content: flex-end; gap: 1.4vw; margin-top: 1vh; }
  .actions button {
    font: inherit;
    font-size: 2.5vh;
    color: var(--fg);
    border: none;
    border-radius: 999px;
    padding: 1.8vh 3vw;
    cursor: pointer;
  }
  .actions button[hidden] { display: none; }
  .actions .ghost { background: rgba(255,255,255,0.1); }
  .actions .go { background: var(--blue); }
  .actions .go:disabled { opacity: 0.4; }

  /* Feedback form modal */
  #formOverlay { gap: 2vw; }
  #formOverlay .sheet {
    position: relative;
    width: 64vw;
    height: 84vh;
    background: #ffffff;
    border-radius: 2.4vh;
    overflow: hidden;
  }
  #formOverlay .phone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4vh;
    text-align: center;
  }
  #formOverlay .phone .qr { padding: 1.4vh; }
  #formOverlay .phone .qr svg { width: 16vh; height: 16vh; }
  #formOverlay .phone .cap { font-size: 2.1vh; color: var(--muted); max-width: 14vw; line-height: 1.4; }
  #formOverlay iframe { width: 100%; height: 100%; border: 0; }
  #formOverlay .close {
    position: absolute;
    top: 1.2vh;
    right: 1.2vh;
    width: 6vh;
    height: 6vh;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 3.2vh;
    line-height: 1;
    cursor: pointer;
  }
</style>
<script src="vendor/qrcode.js"></script>
</head>
<body class="loading">
  <div id="topbar">
    <span id="roomname"></span>
    <span id="clock"></span>
  </div>

  <div class="badge"><span class="dot"></span><span data-text="badge"></span></div>

  <svg class="usb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="19.2" r="1.8"/>
    <path d="M12 17.4V4.5"/>
    <path d="M12 4.5l-2.4 3h4.8z" fill="currentColor" stroke="none"/>
    <circle cx="5.5" cy="9" r="1.6"/>
    <path d="M5.5 10.6v2.2c0 1.2 1 2.2 2.2 2.2H12"/>
    <rect x="16.9" y="7.4" width="3.2" height="3.2"/>
    <path d="M18.5 10.6v2.2c0 1.2-1 2.2-2.2 2.2H12"/>
  </svg>

  <h1 data-text="title"></h1>
  <p class="sub" data-html="subtitle"></p>

  <div id="bottomrow">
    <div id="services"></div>

    <button id="feedback" hidden>
      <div class="qr" id="feedbackQr"></div>
      <span class="title" id="feedbackLabel"></span>
      <span class="cap" id="feedbackCap"></span>
    </button>
  </div>

  <div class="overlay" id="wifiOverlay">
    <div class="qr" id="wifiQr"></div>
    <div class="ssid" id="wifiSsid"></div>
    <div class="hint" id="wifiHint"></div>
  </div>

  <div class="overlay" id="svcDialog">
    <div class="dsheet">
      <h2 id="svcTitle"></h2>
      <p id="svcPrompt"></p>
      <div class="opts" id="svcOpts"></div>
      <input id="svcName" type="text" autocomplete="off">
      <div class="actions">
        <button class="ghost" id="svcCancel" data-text="cancel"></button>
        <button class="go" id="svcSend" data-text="send" disabled></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="formOverlay">
    <div class="sheet">
      <iframe id="formFrame"></iframe>
      <button class="close" id="btnFormClose">✕</button>
    </div>
    <div class="phone">
      <div class="qr" id="formQr"></div>
      <div class="cap" id="formPhoneCap"></div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* Built-in tile icons; services pick one via "icon" in config.json */
  const ICONS = {
    wrench: '<path d="M14.7 6.3a4.2 4.2 0 0 0-5.6 5.2L3.5 17.1a2 2 0 1 0 2.8 2.8l5.6-5.6a4.2 4.2 0 0 0 5.2-5.6l-2.6 2.6-2.5-.7-.7-2.5z"/>',
    coffee: '<path d="M17 8h1a3 3 0 0 1 0 6h-1"/><path d="M4 8h13v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M7 2.5v2.5M11 2.5v2.5M15 2.5v2.5"/>',
    broom: '<path d="M19 3 9.5 12.5"/><path d="M9.5 12.5 5 17c-1.2 1.2-1.5 3-1 4l4.5-1 4-4.5"/><path d="M14 8l2 2"/>',
    bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6v.6"/><circle cx="12" cy="17" r=".8" fill="currentColor" stroke="none"/>',
    wifi: '<path d="M2.5 9a15 15 0 0 1 19 0"/><path d="M5.5 12.5a10.5 10.5 0 0 1 13 0"/><path d="M8.5 16a6 6 0 0 1 7 0"/><circle cx="12" cy="19.2" r="1" fill="currentColor" stroke="none"/>',
  };

  const $ = (id) => document.getElementById(id);

  function icon(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      (ICONS[name] || ICONS.bell) + '</svg>';
  }

  function qrSvg(text) {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    const qr = qrcode(0, 'M');
    qr.addData(text, 'Byte');
    qr.make();
    return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  }

  /* WIFI:T:WPA;S:<ssid>;P:<password>;; — special characters must be escaped */
  function wifiPayload(w) {
    const esc = (s) => String(s || '').replace(/([\\;,:"])/g, '\\$1');
    const type = w.password ? (w.security || 'WPA') : 'nopass';
    return 'WIFI:T:' + type + ';S:' + esc(w.ssid) + ';' + (w.password ? 'P:' + esc(w.password) + ';' : '') + ';';
  }

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  const params = new URLSearchParams(location.search);
  const token = params.get('k') || '';

  fetch('config.json', { cache: 'no-cache' })
    .then((r) => r.json())
    .then(init)
    .catch(function (e) {
      document.body.classList.remove('loading');
      document.querySelector('h1').textContent = 'config.json could not be loaded';
      console.error(e);
    });

  function init(cfg) {
    const T = cfg.text || {};
    document.documentElement.lang = (cfg.locale || 'en').split('-')[0];
    if (cfg.background) {
      document.documentElement.style.setProperty('--bg-image', 'url("' + cfg.background + '")');
    }
    document.querySelectorAll('[data-text]').forEach((n) => { n.textContent = T[n.dataset.text] || ''; });
    document.querySelectorAll('[data-html]').forEach((n) => { n.innerHTML = T[n.dataset.html] || ''; });

    /* Clock — same format as the Navigator top bar */
    const clockEl = $('clock');
    function tick() {
      clockEl.textContent = new Date().toLocaleTimeString(cfg.locale || undefined, { hour: '2-digit', minute: '2-digit' });
    }
    tick();
    setInterval(tick, 10000);

    /* Room name comes from the macro via ?room=... (no device API needed) */
    const roomParam = (params.get('room') || '').trim();
    const room = roomParam || cfg.roomFallback || 'Unknown room';
    $('roomname').textContent = roomParam;

    const servicesEl = $('services');

    /* Service tiles */
    (cfg.services || []).forEach(function (svc) {
      const tile = el('button', 'svc', icon(svc.icon));
      tile.append(svc.label);
      tile.append(el('span', 'state'));
      tile.addEventListener('click', function () {
        if (tile.disabled) return;
        const hasOptions = svc.options && svc.options.length;
        if (!hasOptions && !svc.askName) sendRequest(tile, svc, '', '');
        else openDialog(tile, svc);
      });
      servicesEl.append(tile);
    });

    /* Wi-Fi tile + QR overlay (tap anywhere to close) */
    if (cfg.wifi && cfg.wifi.ssid) {
      const w = cfg.wifi;
      const tile = el('button', 'svc', icon('wifi'));
      tile.append(w.label || 'Wi-Fi');
      const st = el('span', 'state');
      st.textContent = w.ssid;
      tile.append(st);
      servicesEl.append(tile);

      $('wifiQr').innerHTML = qrSvg(wifiPayload(w));
      $('wifiSsid').textContent = (w.label || 'Wi-Fi') + ': ' + w.ssid;
      $('wifiHint').textContent = w.hint || '';
      tile.addEventListener('click', () => $('wifiOverlay').classList.add('open'));
      $('wifiOverlay').addEventListener('click', () => $('wifiOverlay').classList.remove('open'));
    }

    /* Feedback card: QR on screen, tap opens the form in a modal */
    if (cfg.feedback && cfg.feedback.url) {
      const f = cfg.feedback;
      const fb = $('feedback');
      fb.hidden = false;
      const qr = qrSvg(f.url);
      $('feedbackQr').innerHTML = qr;
      $('formQr').innerHTML = qr;
      $('feedbackLabel').textContent = f.label || 'Feedback';
      $('feedbackCap').innerHTML = f.caption || '';
      $('formPhoneCap').innerHTML = f.phoneCaption || '';
      $('formFrame').title = f.label || 'Feedback';
      $('btnFormClose').setAttribute('aria-label', T.close || 'Close');
      fb.addEventListener('click', function () {
        if (!$('formFrame').src) $('formFrame').src = f.embedUrl || f.url; // lazy-load on first open
        $('formOverlay').classList.add('open');
      });
      $('btnFormClose').addEventListener('click', () => $('formOverlay').classList.remove('open'));
    }

    /* Generic request dialog:
         options + askName → pick an option, enter name, press send
         options only      → picking an option sends right away
         askName only      → enter name, press send */
    const dlg = $('svcDialog');
    const optsEl = $('svcOpts');
    const nameEl = $('svcName');
    const sendBtn = $('svcSend');
    nameEl.placeholder = T.namePlaceholder || '';
    let current = null; // { tile, svc, issue }

    function openDialog(tile, svc) {
      current = { tile: tile, svc: svc, issue: '' };
      const hasOptions = !!(svc.options && svc.options.length);
      $('svcTitle').textContent = svc.label;
      $('svcPrompt').textContent = svc.prompt || '';
      optsEl.innerHTML = '';
      (svc.options || []).forEach(function (o) {
        const b = el('button');
        b.textContent = o;
        b.dataset.issue = o;
        optsEl.append(b);
      });
      nameEl.hidden = !svc.askName;
      nameEl.value = '';
      sendBtn.hidden = !svc.askName;
      sendBtn.disabled = hasOptions;
      dlg.classList.add('open');
    }

    optsEl.addEventListener('click', function (e) {
      const opt = e.target.closest('button[data-issue]');
      if (!opt || !current) return;
      current.issue = opt.dataset.issue;
      if (!current.svc.askName) {
        dlg.classList.remove('open');
        sendRequest(current.tile, current.svc, current.issue, '');
        return;
      }
      optsEl.querySelectorAll('button').forEach((b) => b.classList.remove('sel'));
      opt.classList.add('sel');
      sendBtn.disabled = false;
    });
    sendBtn.addEventListener('click', function () {
      dlg.classList.remove('open');
      sendRequest(current.tile, current.svc, current.issue, nameEl.value);
    });
    $('svcCancel').addEventListener('click', () => dlg.classList.remove('open'));

    /* Sending: shows progress/result on the originating tile, 60 s lockout */
    async function sendRequest(tile, svc, issue, name) {
      if (tile.disabled) return;
      tile.disabled = true;
      const stateEl = tile.querySelector('.state');
      stateEl.textContent = T.sending || '…';
      try {
        const res = await fetch('api/help', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Room-Token': token },
          body: JSON.stringify({ room: room, type: svc.id, issue: issue || '', name: name || '' }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        tile.classList.add('done');
        stateEl.textContent = T.sent || '✓';
      } catch (e) {
        stateEl.textContent = T.failed || '✕';
      }
      setTimeout(function () {
        tile.classList.remove('done');
        stateEl.textContent = '';
        tile.disabled = false;
      }, 60000);
    }

    document.body.classList.remove('loading');
  }
})();
</script>
</body>
</html>
